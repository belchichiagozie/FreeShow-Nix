name: Update FreeShow
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: experimental-features = nix-command flakes

      - name: Bump version and hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/ChurchApps/FreeShow/releases/latest --jq .tag_name | sed 's/^v//')
          current=$(grep -oP 'version = "\K[^"]+' flake.nix | head -1)
          [ "$latest" = "$current" ] && exit 0

          sed -i "s/version = \"$current\"/version = \"$latest\"/" flake.nix
          for arch in x86_64 arm64; do
            url="https://github.com/ChurchApps/FreeShow/releases/download/v$latest/FreeShow-$latest-$arch.AppImage"
            hash=$(nix store prefetch-file --json "$url" | jq -r .hash)
            sed -i "/arch = \"$arch\"/s|hash = \"[^\"]*\"|hash = \"$hash\"|" flake.nix
          done

      - name: Verify it still builds
        run: nix build

      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "freeshow: update to latest release"
          title: "freeshow: update to latest release"
          branch: update-freeshow
